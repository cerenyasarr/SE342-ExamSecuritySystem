<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Exam Security System</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-wrapper">
        <div class="glass-card" style="width: 100%; max-width: 400px;">
            <h2 style="text-align: center; margin-bottom: 2rem;">Exam Security System</h2>
            <form onsubmit="App.login(event)">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" class="input-control" placeholder="Enter ID" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" class="input-control" placeholder="••••••••" required>
                </div>
                <div class="input-group">
                    <label>Role</label>
                    <select id="role" class="input-control">
                        <option value="Admin">Admin / Instructor</option>
                        <option value="Proctor">Proctor / Invigilator</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">Sign In</button>
            </form>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
