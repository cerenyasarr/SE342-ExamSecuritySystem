<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Status Report - ESS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <a href="../dashboard.html" class="back-link">← Back to Dashboard</a>

        <h1 class="page-title" style="margin-bottom: 2rem;">Exam Status Report</h1>

        <div class="glass-card static" style="max-width: 900px; margin: 0 auto;">
            <!-- Stats -->
            <div
                style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; margin-bottom: 2rem; text-align: center;">
                <div>
                    <div id="stat-total" style="font-size: 3rem; font-weight: bold; color: #3b82f6;">45</div>
                    <div style="color: var(--text-dim); font-size: 0.9rem;">Total Checked-in</div>
                </div>
                <div>
                    <div id="stat-pending" style="font-size: 3rem; font-weight: bold; color: var(--text-light);">5</div>
                    <div style="color: var(--text-dim); font-size: 0.9rem;">Pending</div>
                </div>
                <div>
                    <div id="stat-rate" style="font-size: 3rem; font-weight: bold; color: var(--success);">98%</div>
                    <div style="color: var(--text-dim); font-size: 0.9rem;">Attendance Rate</div>
                </div>
            </div>

            <!-- Live Feed -->
            <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">Live Feed</h3>

            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                        <th style="text-align: left; padding: 1rem; color: var(--text-dim); font-weight: 500;">Time</th>
                        <th style="text-align: left; padding: 1rem; color: var(--text-dim); font-weight: 500;">Student
                        </th>
                        <th style="text-align: left; padding: 1rem; color: var(--text-dim); font-weight: 500;">Seat</th>
                        <th style="text-align: left; padding: 1rem; color: var(--text-dim); font-weight: 500;">Result
                        </th>
                    </tr>
                </thead>
                <tbody id="feed-tbody">
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                        <td style="padding: 1rem;">10:05 AM</td>
                        <td style="padding: 1rem;">John Doe</td>
                        <td style="padding: 1rem;">A1</td>
                        <td style="padding: 1rem;"><span style="color: var(--success);">Success</span></td>
                    </tr>
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                        <td style="padding: 1rem;">10:02 AM</td>
                        <td style="padding: 1rem;">Jane Smith</td>
                        <td style="padding: 1rem;">B3</td>
                        <td style="padding: 1rem;"><span style="color: var(--success);">Success</span></td>
                    </tr>
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                        <td style="padding: 1rem;">10:00 AM</td>
                        <td style="padding: 1rem;">Mark Lee</td>
                        <td style="padding: 1rem;">-</td>
                        <td style="padding: 1rem;"><span style="color: var(--danger);">Failed (Mismatch)</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await loadExamStatus();
        });

        async function loadExamStatus() {
            try {
                // Try to load real data
                const response = await API.get(API_CONFIG.ENDPOINTS.STUDENT_EXAMS.BASE);
                const data = await response.json();

                if (data && data.length > 0) {
                    const attended = data.filter(s => s.status === 'attended').length;
                    const pending = data.filter(s => s.status === 'pending').length;
                    const rate = data.length > 0 ? Math.round((attended / data.length) * 100) : 0;

                    document.getElementById('stat-total').textContent = attended;
                    document.getElementById('stat-pending').textContent = pending;
                    document.getElementById('stat-rate').textContent = rate + '%';

                    // Update table
                    const tbody = document.getElementById('feed-tbody');
                    tbody.innerHTML = data.slice(0, 10).map(s => `
                        <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                            <td style="padding: 1rem;">${formatTime(s.check_in_time)}</td>
                            <td style="padding: 1rem;">${s.student_name || 'Unknown'}</td>
                            <td style="padding: 1rem;">${s.seat_label || '-'}</td>
                            <td style="padding: 1rem;">
                                <span style="color: ${s.verification_status === 'success' ? 'var(--success)' : 'var(--danger)'};">
                                    ${s.verification_status === 'success' ? 'Success' : 'Failed (Mismatch)'}
                                </span>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                console.log('Using demo data');
            }
        }

        function formatTime(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        }
    </script>
</body>

</html>
