<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İhlal ve Olay Raporları - ESS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .filter-btn {
            padding: 0.5rem 1.25rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--primary);
        }

        .filter-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.15);
        }

        .violation-card {
            background: rgba(239, 68, 68, 0.08);
            border-left: 4px solid var(--danger);
            border-radius: 0.5rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .violation-card .title {
            color: var(--danger);
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .violation-card .student-info {
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .violation-card .description {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 0.75rem;
        }

        .violation-card .right-side {
            text-align: right;
            flex-shrink: 0;
        }

        .violation-card .date {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .violation-card .status {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .btn-detail {
            background: var(--primary);
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.35rem;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="../dashboard.html" class="back-link">← Dashboard'a Dön</a>

        <h1 class="page-title" style="margin-bottom: 2rem;">
            <span>🚨</span>
            İhlal ve Olay Raporları
        </h1>

        <div class="glass-card static" style="max-width: 900px; margin: 0 auto;">
            <!-- Filter Buttons -->
            <div style="display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                <button class="filter-btn active" onclick="filterViolations('all', this)">Tümü</button>
                <button class="filter-btn" onclick="filterViolations('face_mismatch', this)">Yüz Hatası</button>
                <button class="filter-btn" onclick="filterViolations('wrong_seat', this)">Koltuk Hatası</button>
                <button class="filter-btn" onclick="filterViolations('phone_detected', this)">Telefon</button>
                <button class="filter-btn" onclick="filterViolations('talking', this)">Konuşma</button>
            </div>

            <!-- Violations List -->
            <div id="violations-container">
                <div class="empty-state" style="padding: 2rem; text-align: center; color: var(--text-dim);">
                    Yükleniyor...
                </div>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>
    <script>
        let allViolations = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadViolations();
        });

        async function loadViolations() {
            const container = document.getElementById('violations-container');
            
            try {
                const response = await API.get(API_CONFIG.ENDPOINTS.VIOLATIONS.BASE);
                allViolations = await response.json();
                
                if (allViolations && allViolations.length > 0) {
                    renderViolations(allViolations);
                } else {
                    container.innerHTML = '<div class="empty-state" style="padding: 2rem; text-align: center; color: var(--text-dim);">Henüz ihlal kaydı yok</div>';
                }
            } catch (error) {
                console.error('İhlaller yüklenemedi:', error);
                container.innerHTML = '<div class="empty-state" style="padding: 2rem; text-align: center; color: var(--text-dim);">İhlaller yüklenemedi</div>';
            }
        }

        function filterViolations(type, btn) {
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Filter cards
            if (type === 'all') {
                renderViolations(allViolations);
            } else {
                const filtered = allViolations.filter(v => v.violation_type === type);
                renderViolations(filtered);
            }
        }

        function renderViolations(violations) {
            const container = document.getElementById('violations-container');
            
            if (!violations || violations.length === 0) {
                container.innerHTML = '<div class="empty-state" style="padding: 2rem; text-align: center; color: var(--text-dim);">Bu filtrede ihlal bulunamadı</div>';
                return;
            }

            container.innerHTML = violations.map(v => `
                <div class="violation-card" data-type="${v.violation_type}">
                    <div class="left-side">
                        <div class="title">${formatType(v.violation_type)} - KRİTİK</div>
                        <div class="student-info"><strong>Öğrenci:</strong> ${v.student_name || 'Bilinmiyor'}</div>
                        <div class="description">${v.description || 'Açıklama yok'}</div>
                        <button class="btn-detail" onclick="showDetail('${v.violation_id}')">Detay Gör</button>
                    </div>
                    <div class="right-side">
                        <div class="date">${formatDate(v.reported_at)}</div>
                    </div>
                </div>
            `).join('');
        }

        function formatType(type) {
            const types = {
                'face_mismatch': 'YÜZ UYUŞMAZLIĞI',
                'wrong_seat': 'KOLTUK HATASI',
                'phone_detected': 'TELEFON TESPİT EDİLDİ',
                'talking': 'KONUŞMA',
                'looking_around': 'ETRAF İZLEME',
                'unauthorized_material': 'YASAK MATERYAL',
                'absence': 'DEVAMSIZLIK',
                'other': 'DİĞER'
            };
            return types[type] || type?.toUpperCase() || 'İHLAL';
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('tr-TR') + ' ' + date.toLocaleTimeString('tr-TR');
        }

        function showDetail(violationId) {
            const violation = allViolations.find(v => v.violation_id === violationId);
            if (violation) {
                alert(`İhlal Detayı:\n\nTür: ${formatType(violation.violation_type)}\nÖğrenci: ${violation.student_name || 'Bilinmiyor'}\nAçıklama: ${violation.description || 'Yok'}\nTarih: ${formatDate(violation.reported_at)}`);
            }
        }
    </script>
</body>

</html>
