<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Violation Report - ESS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <a href="../dashboard.html" style="color: var(--text-dim); text-decoration: none;">← Back to Dashboard</a>
        <h1 style="margin-top: 1rem;">Violation & Incident Report</h1>

        <div class="glass-card" style="margin-top: 2rem;">
            <!-- Filters -->
            <div style="display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap;">
                <div class="input-group" style="flex: 1; min-width: 200px; margin: 0;">
                    <label>Filter by Exam</label>
                    <select id="exam-filter" class="input-control" onchange="loadViolations()">
                        <option value="">All Exams</option>
                    </select>
                </div>
                <div style="display: flex; gap: 0.5rem; align-items: flex-end;">
                    <button class="btn btn-primary filter-btn active" onclick="filterByType('')" style="background: rgba(255,255,255,0.1);">All</button>
                    <button class="btn btn-primary filter-btn" onclick="filterByType('face_mismatch')" style="background: rgba(255,255,255,0.1);">Identity Mismatch</button>
                    <button class="btn btn-primary filter-btn" onclick="filterByType('wrong_seat')" style="background: rgba(255,255,255,0.1);">Seat Violation</button>
                </div>
            </div>

            <!-- Violations List -->
            <div id="violations-loading" style="text-align: center; padding: 2rem; color: var(--text-dim);">
                Loading violations...
            </div>
            <div id="violations-container">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>
    
    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>
    <script>
        let allViolations = [];
        let currentFilter = '';
        
        document.addEventListener('DOMContentLoaded', async () => {
            await App.loadExams('exam-filter');
            await loadViolations();
        });
        
        async function loadViolations() {
            const examId = document.getElementById('exam-filter').value;
            const loading = document.getElementById('violations-loading');
            const container = document.getElementById('violations-container');
            
            loading.style.display = 'block';
            container.innerHTML = '';
            
            try {
                let url = API_CONFIG.ENDPOINTS.VIOLATIONS.BASE;
                if (examId) {
                    url = API_CONFIG.ENDPOINTS.VIOLATIONS.BY_EXAM(examId);
                }
                
                const response = await API.get(url);
                const data = await response.json();
                allViolations = examId ? data.violations : data;
                
                loading.style.display = 'none';
                renderViolations();
            } catch (error) {
                console.error('Error loading violations:', error);
                loading.textContent = 'Error loading violations.';
            }
        }
        
        function filterByType(type) {
            currentFilter = type;
            
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.style.background = 'rgba(255,255,255,0.1)';
            });
            event.target.classList.add('active');
            event.target.style.background = 'var(--primary)';
            
            renderViolations();
        }
        
        function renderViolations() {
            const container = document.getElementById('violations-container');
            
            let filtered = allViolations;
            if (currentFilter) {
                filtered = allViolations.filter(v => v.violation_type === currentFilter);
            }
            
            if (!filtered || filtered.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-dim); padding: 2rem;">No violations found.</p>';
                return;
            }
            
            container.innerHTML = filtered.map(v => {
                const isSevere = ['face_mismatch', 'unauthorized_material'].includes(v.violation_type);
                const borderColor = isSevere ? 'var(--danger)' : '#f59e0b';
                const bgColor = isSevere ? 'rgba(239, 68, 68, 0.1)' : 'rgba(245, 158, 11, 0.1)';
                const severity = isSevere ? 'Severe' : 'Warning';
                
                return `
                    <div style="background: ${bgColor}; border: 1px solid ${borderColor}; border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 1rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h3 style="color: ${borderColor};">${formatViolationType(v.violation_type)} - ${severity}</h3>
                            <span style="color: var(--text-dim);">${new Date(v.detected_at).toLocaleTimeString()}</span>
                        </div>
                        <p style="margin: 0.5rem 0;"><strong>Student:</strong> ${v.student_name || 'Unknown'}</p>
                        <p style="color: var(--text-dim);">${v.description || 'No description provided'}</p>
                        <p style="margin: 0.5rem 0;"><strong>Status:</strong> 
                            <span class="status-badge ${v.status === 'Confirmed' ? 'status-danger' : 'status-warning'}">${v.status}</span>
                        </p>
                        <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                            ${v.evidence_url ? '<button class="btn btn-primary" style="font-size: 0.8rem;">View Evidence</button>' : ''}
                            ${v.status !== 'Confirmed' ? `<button class="btn btn-danger" style="font-size: 0.8rem;" onclick="confirmViolation(${v.id})">Confirm Violation</button>` : ''}
                            ${v.status !== 'Resolved' ? `<button class="btn" style="font-size: 0.8rem; background: rgba(255,255,255,0.1);" onclick="resolveViolation(${v.id})">Resolve</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function formatViolationType(type) {
            const types = {
                'face_mismatch': 'Identity Mismatch',
                'wrong_seat': 'Wrong Seat',
                'phone_detected': 'Phone Detected',
                'talking': 'Talking',
                'looking_around': 'Looking Around',
                'unauthorized_material': 'Unauthorized Material',
                'absence': 'Absence',
                'other': 'Other'
            };
            return types[type] || type;
        }
        
        async function confirmViolation(id) {
            try {
                const response = await API.put(API_CONFIG.ENDPOINTS.VIOLATIONS.BY_ID(id), {
                    status: 'Confirmed'
                });
                
                if (response.ok) {
                    App.showSuccess('Violation confirmed');
                    await loadViolations();
                }
            } catch (error) {
                App.showError('Error confirming violation');
            }
        }
        
        async function resolveViolation(id) {
            try {
                const response = await API.put(API_CONFIG.ENDPOINTS.VIOLATIONS.BY_ID(id), {
                    status: 'Resolved'
                });
                
                if (response.ok) {
                    App.showSuccess('Violation resolved');
                    await loadViolations();
                }
            } catch (error) {
                App.showError('Error resolving violation');
            }
        }
    </script>
</body>

</html>
