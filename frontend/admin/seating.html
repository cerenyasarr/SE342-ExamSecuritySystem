<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Seating Plan - ESS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .seating-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
            margin-top: 2rem;
        }

        .seat {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
            text-align: center;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .seat:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .seat.selected {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.2);
        }

        .seat.blocked {
            background: rgba(239, 68, 68, 0.1);
            color: var(--text-dim);
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="../dashboard.html" style="color: var(--text-dim); text-decoration: none;">← Back to Dashboard</a>
        <h1 style="margin-top: 1rem;">Seating Plan Editor</h1>

        <div class="glass-card" style="margin-top: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                <div class="input-group" style="margin: 0; flex: 1; min-width: 200px;">
                    <label>Select Exam</label>
                    <select id="exam-select" class="input-control" onchange="loadSeating()">
                        <option value="">Loading exams...</option>
                    </select>
                </div>
                <div style="display: flex; gap: 0.5rem;">
                    <button class="btn btn-primary" style="font-size: 0.9rem;" onclick="autoAssign()">Auto-Assign</button>
                    <button class="btn btn-primary" style="font-size: 0.9rem; background: var(--success);">Save Layout</button>
                </div>
            </div>

            <div id="seating-loading" style="text-align: center; padding: 3rem; color: var(--text-dim);">
                Select an exam to view seating plan
            </div>
            
            <div id="seating-grid" class="seating-grid" style="display: none;">
                <!-- Dynamically populated -->
            </div>
            
            <div id="seating-stats" style="margin-top: 2rem; display: none;">
                <div style="display: flex; gap: 2rem; justify-content: center;">
                    <div style="text-align: center;">
                        <div style="font-size: 2rem; font-weight: bold; color: var(--success);" id="stat-assigned">0</div>
                        <div style="color: var(--text-dim);">Assigned</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 2rem; font-weight: bold; color: var(--text-light);" id="stat-empty">0</div>
                        <div style="color: var(--text-dim);">Empty</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>
    <script>
        let currentExamId = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            await App.loadExams('exam-select');
        });
        
        async function loadSeating() {
            const examSelect = document.getElementById('exam-select');
            currentExamId = examSelect.value;
            
            const loading = document.getElementById('seating-loading');
            const grid = document.getElementById('seating-grid');
            const stats = document.getElementById('seating-stats');
            
            if (!currentExamId) {
                loading.style.display = 'block';
                loading.textContent = 'Select an exam to view seating plan';
                grid.style.display = 'none';
                stats.style.display = 'none';
                return;
            }
            
            loading.style.display = 'block';
            loading.textContent = 'Loading seating plan...';
            grid.style.display = 'none';
            
            try {
                const enrollments = await App.loadSeatingGrid(currentExamId, 'seating-grid');
                loading.style.display = 'none';
                grid.style.display = 'grid';
                stats.style.display = 'block';
                
                // Update stats - count enrollments with assigned seats
                const assigned = enrollments.filter(e => e.assigned_row && e.assigned_col).length;
                const total = enrollments.length;
                document.getElementById('stat-assigned').textContent = assigned;
                document.getElementById('stat-empty').textContent = total - assigned;
            } catch (error) {
                loading.textContent = 'Koltuk düzeni yüklenemedi.';
            }
        }
        
        async function autoAssign() {
            if (!currentExamId) {
                App.showError('Please select an exam first');
                return;
            }
            
            const students = await App.autoAssignSeats(currentExamId);
            if (students) {
                await loadSeating();
            }
        }
    </script>
</body>

</html>
