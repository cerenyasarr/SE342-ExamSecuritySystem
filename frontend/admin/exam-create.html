<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Sınav Oluştur - ESS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <a href="../dashboard.html" class="back-link">← Dashboard'a Dön</a>

        <div class="glass-card static form-card">
            <h2>
                <span class="icon">📝</span>
                Yeni Sınav Oluştur
            </h2>

            <form id="exam-form" onsubmit="createExam(event)">
                <div class="input-group">
                    <label>Sınav Adı</label>
                    <input type="text" name="exam_title" class="input-control" placeholder="Örn: SE342 Final Sınavı"
                        required>
                </div>

                <div class="input-group">
                    <label>Ders Kodu</label>
                    <input type="text" name="course_code" class="input-control" placeholder="Örn: SE342" required>
                </div>

                <div class="input-group">
                    <label>Salon</label>
                    <select name="room_id" id="room-select" class="input-control">
                        <option value="">-- Salon Seçin (Opsiyonel) --</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Başlangıç Tarihi/Saati</label>
                    <input type="datetime-local" name="start_time" class="input-control" required>
                </div>

                <div class="input-group">
                    <label>Bitiş Tarihi/Saati</label>
                    <input type="datetime-local" name="end_time" class="input-control" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Sınav Oluştur</button>
            </form>

            <!-- Mevcut Sınavlar -->
            <div class="existing-section">
                <h3>
                    <span>📋</span>
                    Mevcut Sınavlar
                </h3>
                <div id="exams-list">
                    <div class="empty-state" style="padding: 1rem; color: var(--text-dim); text-align: center;">
                        Yükleniyor...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await Promise.all([
                loadRooms(),
                loadExams()
            ]);
        });

        async function loadRooms() {
            const select = document.getElementById('room-select');
            try {
                const response = await API.get(API_CONFIG.ENDPOINTS.ROOMS.BASE);
                const rooms = await response.json();

                select.innerHTML = '<option value="">-- Salon Seçin (Opsiyonel) --</option>';
                rooms.forEach(room => {
                    const option = document.createElement('option');
                    option.value = room.room_id;
                    option.textContent = `${room.room_name} (${room.capacity} kişi)`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Salonlar yüklenemedi:', error);
                select.innerHTML = '<option value="">Salon yüklenemedi</option>';
            }
        }

        async function loadExams() {
            const container = document.getElementById('exams-list');
            try {
                const response = await API.get(API_CONFIG.ENDPOINTS.EXAMS.BASE);
                const exams = await response.json();

                if (exams && exams.length > 0) {
                    container.innerHTML = exams.map(exam => `
                        <div class="existing-item">
                            <div class="info">
                                <span class="title">${exam.exam_title}</span>
                                <span class="meta">${exam.course_code} | ${formatDate(exam.start_time)}</span>
                            </div>
                            <span class="status-badge status-${exam.status || 'scheduled'}">${translateStatus(exam.status)}</span>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="empty-state" style="padding: 1rem; color: var(--text-dim); text-align: center;">Henüz sınav oluşturulmamış</div>';
                }
            } catch (error) {
                console.error('Sınavlar yüklenemedi:', error);
                container.innerHTML = '<div class="empty-state" style="padding: 1rem; color: var(--text-dim); text-align: center;">Sınavlar yüklenemedi</div>';
            }
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('tr-TR') + ' ' + date.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        }

        function translateStatus(status) {
            const statuses = {
                'scheduled': 'Planlandı',
                'active': 'Aktif',
                'completed': 'Tamamlandı'
            };
            return statuses[status] || 'Planlandı';
        }

        async function createExam(event) {
            event.preventDefault();

            const form = event.target;
            const formData = new FormData(form);

            const examData = {
                exam_title: formData.get('exam_title'),
                course_code: formData.get('course_code'),
                room_id: formData.get('room_id') || null,
                start_time: formData.get('start_time'),
                end_time: formData.get('end_time')
            };

            try {
                const response = await API.post(API_CONFIG.ENDPOINTS.EXAMS.BASE, examData);

                if (response.ok) {
                    App.showSuccess('Sınav başarıyla oluşturuldu!');
                    form.reset();
                    await loadExams();
                } else {
                    const error = await response.json();
                    App.showError(error.error || 'Sınav oluşturulamadı.');
                }
            } catch (error) {
                console.error('Sınav oluşturma hatası:', error);
                App.showError('Sunucu bağlantı hatası.');
            }
        }
    </script>
</body>

</html>
