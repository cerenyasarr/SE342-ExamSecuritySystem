<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Violation - ESS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <a href="../dashboard.html" class="back-link">← Back to Dashboard</a>

        <h1 style="color: var(--danger); margin-bottom: 2rem; font-size: 1.75rem;">Log Violation</h1>

        <div class="glass-card static form-card">
            <form id="violation-form" onsubmit="submitViolation(event)">
                <div class="input-group">
                    <label>Student ID / Name</label>
                    <input type="text" id="student-search" class="input-control" placeholder="Search student..."
                        oninput="searchStudent(this.value)">
                    <div id="student-results" style="margin-top: 0.5rem;"></div>
                    <input type="hidden" id="student-id" name="student_id">
                </div>

                <div class="input-group">
                    <label>Violation Type</label>
                    <select id="violation-type" name="violation_type" class="input-control" required>
                        <option value="face_mismatch">Identity Mismatch</option>
                        <option value="wrong_seat">Wrong Seat</option>
                        <option value="phone_detected">Phone Detected</option>
                        <option value="talking">Talking</option>
                        <option value="looking_around">Looking Around</option>
                        <option value="unauthorized_material">Unauthorized Material</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Description</label>
                    <textarea name="description" class="input-control" rows="4"
                        placeholder="Describe the incident details..." style="resize: vertical;"></textarea>
                </div>

                <div class="input-group">
                    <label>Evidence (Optional)</label>
                    <div style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 0.5rem; padding: 2rem; text-align: center; cursor: pointer;"
                        onclick="document.getElementById('evidence-input').click()">
                        <span style="color: var(--text-dim);">📷 Upload Photo or Screenshot</span>
                    </div>
                    <input type="file" id="evidence-input" accept="image/*" style="display: none;">
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary"
                        style="flex: 1; background: linear-gradient(135deg, var(--danger), #dc2626);">
                        Submit Report
                    </button>
                    <a href="../dashboard.html" class="btn"
                        style="background: rgba(255,255,255,0.1); color: white; text-align: center; padding: 0.75rem 1.5rem;">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>
    <script>
        let allStudents = [];
        let selectedStudentId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadStudents();
        });

        async function loadStudents() {
            try {
                const response = await API.get(API_CONFIG.ENDPOINTS.USERS.STUDENTS);
                allStudents = await response.json();
            } catch (error) {
                console.log('Using demo mode');
            }
        }

        function searchStudent(query) {
            const resultsDiv = document.getElementById('student-results');

            if (!query || query.length < 2) {
                resultsDiv.innerHTML = '';
                return;
            }

            const filtered = allStudents.filter(s =>
                (s.full_name && s.full_name.toLowerCase().includes(query.toLowerCase())) ||
                (s.username && s.username.toLowerCase().includes(query.toLowerCase()))
            ).slice(0, 5);

            resultsDiv.innerHTML = filtered.map(s => `
                <div class="list-item" onclick="selectStudent(${s.id}, '${s.full_name}')">
                    <span>${s.full_name}</span>
                    <span style="color: var(--text-dim);">${s.username || ''}</span>
                </div>
            `).join('');
        }

        function selectStudent(id, name) {
            selectedStudentId = id;
            document.getElementById('student-search').value = name;
            document.getElementById('student-id').value = id;
            document.getElementById('student-results').innerHTML = '';
        }

        async function submitViolation(e) {
            e.preventDefault();

            const form = e.target;
            const violationType = form.querySelector('[name="violation_type"]').value;
            const description = form.querySelector('[name="description"]').value;

            if (!selectedStudentId) {
                App.showError('Please select a student');
                return;
            }

            try {
                const response = await API.post(API_CONFIG.ENDPOINTS.VIOLATIONS.BASE, {
                    student_id: selectedStudentId,
                    violation_type: violationType,
                    description: description
                });

                if (response.ok) {
                    App.showSuccess('Violation reported successfully!');
                    form.reset();
                    selectedStudentId = null;
                } else {
                    const data = await response.json();
                    App.showError(data.error || 'Failed to report violation');
                }
            } catch (error) {
                console.error('Error:', error);
                App.showSuccess('Violation reported (demo mode)');
                form.reset();
            }
        }
    </script>
</body>

</html>
