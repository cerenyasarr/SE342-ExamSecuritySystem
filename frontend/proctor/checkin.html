<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sınav Check-in - ESS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .checkin-layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            .checkin-layout {
                grid-template-columns: 1fr;
            }
        }

        .student-list {
            max-height: 450px;
            overflow-y: auto;
        }

        .student-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.5rem;
        }

        .student-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .student-item.selected {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .student-item.verified {
            background: rgba(16, 185, 129, 0.1);
        }

        .student-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .avatar-z {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }

        .avatar-b {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .avatar-e {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .avatar-c {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .avatar-a {
            background: linear-gradient(135deg, #ec4899, #db2777);
        }

        .student-info {
            flex-grow: 1;
        }

        .student-name {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .student-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }

        .seat-badge {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 0.15rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-badge-small {
            padding: 0.15rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .status-waiting {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .status-done {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        .camera-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .camera-preview-large {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 4/3;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 0.75rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .camera-preview-large video,
        .camera-preview-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-buttons {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            width: 100%;
            max-width: 400px;
        }

        .btn-verify {
            flex: 2;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-error {
            flex: 1;
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 500;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="../dashboard.html" class="back-link">← Dashboard'a Dön</a>

        <div class="glass-card static" style="max-width: 950px; margin: 0 auto;">
            <h2 style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem;">
                <span>🎓</span>
                Sınav Check-in
            </h2>

            <!-- Exam Selector -->
            <div class="input-group" style="margin-bottom: 1.5rem;">
                <label>Sınav Seçin</label>
                <select id="exam-select" class="input-control" onchange="loadExamStudents()" style="max-width: 400px;">
                    <option value="">-- Sınav Seçin --</option>
                </select>
            </div>

            <div class="checkin-layout">
                <!-- Student List -->
                <div>
                    <h4 style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
                        <span>👥</span>
                        Öğrenci Listesi
                    </h4>
                    <div class="student-list" id="student-list">
                        <div class="empty-state" style="padding: 1rem; color: var(--text-dim); text-align: center;">
                            Önce sınav seçin...
                        </div>
                    </div>
                </div>

                <!-- Camera Section -->
                <div class="camera-section">
                    <div class="camera-preview-large" id="camera-container">
                        <span id="camera-placeholder" style="color: var(--text-dim);">📷 Kamera</span>
                        <video id="video" autoplay playsinline style="display: none;"></video>
                    </div>
                    <div class="camera-buttons">
                        <button class="btn-verify" onclick="verifyFace()">
                            <span>✓</span>
                            Yüzü Doğrula
                        </button>
                        <button class="btn-error" onclick="simulateError()">
                            Hata Simüle Et
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>
    <script>
        let selectedStudentId = null;
        let selectedStudentName = null;
        let currentExamId = null;
        let stream = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadExams();
            await openCamera();
        });

        async function loadExams() {
            const select = document.getElementById('exam-select');
            try {
                const response = await API.get(API_CONFIG.ENDPOINTS.EXAMS.BASE);
                const exams = await response.json();

                select.innerHTML = '<option value="">-- Sınav Seçin --</option>';
                exams.forEach(exam => {
                    const option = document.createElement('option');
                    option.value = exam.exam_id;
                    option.textContent = `${exam.exam_title} - ${exam.course_code}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Sınavlar yüklenemedi:', error);
                select.innerHTML = '<option value="">Sınav yüklenemedi</option>';
            }
        }

        async function loadExamStudents() {
            currentExamId = document.getElementById('exam-select').value;
            const container = document.getElementById('student-list');
            
            if (!currentExamId) {
                container.innerHTML = '<div class="empty-state" style="padding: 1rem; color: var(--text-dim); text-align: center;">Önce sınav seçin...</div>';
                return;
            }

            container.innerHTML = '<div class="empty-state" style="padding: 1rem; color: var(--text-dim); text-align: center;">Yükleniyor...</div>';

            try {
                const response = await API.get(API_CONFIG.ENDPOINTS.EXAMS.ENROLLMENTS(currentExamId));
                const enrollments = await response.json();
                
                if (enrollments.length === 0) {
                    container.innerHTML = '<div class="empty-state" style="padding: 1rem; color: var(--text-dim); text-align: center;">Bu sınava kayıtlı öğrenci yok</div>';
                } else {
                    renderStudentList(enrollments);
                }
            } catch (error) {
                console.error('Öğrenciler yüklenemedi:', error);
                container.innerHTML = '<div class="empty-state" style="padding: 1rem; color: var(--text-dim); text-align: center;">Öğrenciler yüklenemedi</div>';
            }
        }

        function renderStudentList(enrollments) {
            const container = document.getElementById('student-list');
            const avatarClasses = ['avatar-z', 'avatar-b', 'avatar-e', 'avatar-c', 'avatar-a'];

            container.innerHTML = enrollments.map((e, i) => {
                const name = e.student_name || 'Bilinmiyor';
                const initial = name[0].toUpperCase();
                const avatarClass = avatarClasses[i % avatarClasses.length];
                const isVerified = e.status === 'attended';
                const studentId = e.student_id;
                const seatLabel = e.seat_label || '-';

                return `
                    <div class="student-item ${isVerified ? 'verified' : ''}" onclick="selectStudent(this, '${studentId}', '${name}', '${seatLabel}')">
                        <div class="student-avatar ${avatarClass}">${initial}</div>
                        <div class="student-info">
                            <div class="student-name">${name}</div>
                            <div class="student-meta">
                                <span class="seat-badge">${seatLabel}</span>
                                <span class="status-badge-small ${isVerified ? 'status-done' : 'status-waiting'}">
                                    ${isVerified ? '✓ Onaylı' : 'Bekliyor'}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectStudent(element, id, name, seat) {
            // Remove previous selection
            document.querySelectorAll('.student-item').forEach(item => item.classList.remove('selected'));
            element.classList.add('selected');

            selectedStudentId = id;
            selectedStudentName = name;
        }

        async function openCamera() {
            try {
                const video = document.getElementById('video');
                const placeholder = document.getElementById('camera-placeholder');

                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
                });

                video.srcObject = stream;
                video.style.display = 'block';
                placeholder.style.display = 'none';
            } catch (error) {
                console.error('Camera error:', error);
            }
        }

        async function verifyFace() {
            if (!selectedStudentId) {
                App.showError('Lütfen önce bir öğrenci seçin');
                return;
            }

            if (!currentExamId) {
                App.showError('Lütfen önce bir sınav seçin');
                return;
            }

            const video = document.getElementById('video');
            if (!video.srcObject) {
                App.showError('Lütfen önce kamerayı açın');
                return;
            }

            // Capture photo from video
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            const capturedImage = canvas.toDataURL('image/jpeg', 0.8);

            // Show loading state
            App.showSuccess('Yüz doğrulanıyor...');

            try {
                const response = await API.post(API_CONFIG.ENDPOINTS.STUDENT_EXAMS.VERIFY_FACE, {
                    student_id: selectedStudentId,
                    exam_id: currentExamId,
                    captured_image: capturedImage
                });

                const result = await response.json();

                if (response.ok) {
                    if (result.verified) {
                        // Success - face matched!
                        App.showSuccess(`✓ ${result.student_name} doğrulandı! (Güven: %${Math.round(result.confidence * 100)})`);
                        
                        // Update UI
                        const selectedItem = document.querySelector('.student-item.selected');
                        if (selectedItem) {
                            selectedItem.classList.add('verified');
                            const statusBadge = selectedItem.querySelector('.status-badge-small');
                            if (statusBadge) {
                                statusBadge.className = 'status-badge-small status-done';
                                statusBadge.textContent = '✓ Onaylı';
                            }
                        }
                    } else {
                        // Face did not match
                        App.showError(`✗ ${result.student_name} yüz eşleşmedi! (Güven: %${Math.round(result.confidence * 100)})`);
                        
                        // Update UI to show mismatch
                        const selectedItem = document.querySelector('.student-item.selected');
                        if (selectedItem) {
                            const statusBadge = selectedItem.querySelector('.status-badge-small');
                            if (statusBadge) {
                                statusBadge.className = 'status-badge-small status-error';
                                statusBadge.textContent = '✗ Eşleşmedi';
                            }
                        }
                    }
                } else {
                    App.showError(result.error || 'Doğrulama başarısız');
                }
            } catch (error) {
                console.error('Verification error:', error);
                App.showError('Sunucu bağlantı hatası');
            }
        }

        function simulateError() {
            App.showError('Bu buton artık kullanılmıyor. Gerçek yüz doğrulama aktif.');
        }
    </script>
</body>

</html>
